name: Rehabwheel Android release candidate
on:
  workflow_dispatch:
  push:
    paths:
      - "android-release/**"
      - ".github/workflows/rehabwheel-android-release-candidate.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Prepare public website
        run: node prepare.mjs
      - name: Install Capacitor
        run: npm install --no-audit --no-fund --no-save @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
      - name: Generate Android project
        run: npx cap add android && npx cap sync android
      - name: Build Android debug APK and unsigned release AAB
        run: |
          cd android
          bash ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: rehabwheel-android-debug-apk
          path: android-release/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rehabwheel-android-unsigned-aab
          path: android-release/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
