name: Rehabwheel Military Hub Firebase rules emulator
on:
  push:
    paths:
      - 'military/backend/**'
      - '.github/workflows/military-hub-rules.yml'
  pull_request:
    paths:
      - 'military/backend/**'
      - '.github/workflows/military-hub-rules.yml'
permissions:
  contents: read
jobs:
  security-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator and rules test dependencies
        run: npm install --prefix military/backend --no-audit --no-fund
      - name: Execute dedicated-project Firestore and Storage role tests
        working-directory: military/backend
        run: npm run test:rules
