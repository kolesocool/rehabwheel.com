name: LegMaker performance lab QA
on:
  push:
    paths:
      - "performance-labs/**"
      - "community/backend/firestore.rules"
      - ".github/workflows/performance-labs-qa.yml"
  pull_request:
    paths:
      - "performance-labs/**"
      - "community/backend/firestore.rules"
      - ".github/workflows/performance-labs-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the private labs UI, identity gates, metadata and routes
        run: node performance-labs/verify.mjs
