name: Rehabwheel iOS sports simulator preview
on:
  push:
    paths:
      - "community/index.html"
      - "community/editorial.css"
      - "community/native-preview/**"
      - "capacitor.config.json"
      - ".github/workflows/rehabwheel-ios-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare sports-only offline bundle
        run: node community/native-preview/prepare.mjs
      - name: Install temporary Capacitor build dependencies
        run: |
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/ios@7 @capacitor/cli@7
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS Simulator application
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Pack simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/rehabwheel-sports-ios-simulator.zip" App.app
      - name: Upload internal-only iOS Simulator package
        uses: actions/upload-artifact@v4
        with:
          name: rehabwheel-ios-sports-simulator-preview
          path: rehabwheel-sports-ios-simulator.zip
          retention-days: 7
          if-no-files-found: error
