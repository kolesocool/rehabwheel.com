name: Rehabwheel brand QA
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/rw26-brand.css'
      - 'scripts/verify-brand-2026.mjs'
      - '.github/workflows/brand-qa.yml'
  pull_request:
    paths:
      - '*.html'
      - 'assets/rw26-brand.css'
      - 'scripts/verify-brand-2026.mjs'
      - '.github/workflows/brand-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify homepage and site design release
        run: node scripts/verify-brand-2026.mjs
