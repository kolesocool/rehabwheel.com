name: Rehabwheel Android emulator boot smoke
on:
  push:
    paths:
      - "community/native-preview/**"
      - ".github/workflows/rehabwheel-android-emulator-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bundled sports-first preview
        run: |
          node community/native-preview/prepare.mjs
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npx cap add android
          npx cap sync android
          cd android
          bash ./gradlew --no-daemon assembleDebug
      - name: Boot Android emulator and check app process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.rehabwheel.sports.preview -c android.intent.category.LAUNCHER 1
            sleep 9
            adb shell pidof com.rehabwheel.sports.preview
            adb exec-out screencap -p > /tmp/rehabwheel-android-start.png
      - name: Store Android emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehabwheel-android-boot-screenshot
          path: /tmp/rehabwheel-android-start.png
          if-no-files-found: ignore
          retention-days: 7
