name: Rehabwheel Military Hub security and browser QA
on:
  push:
    paths:
      - 'military/**'
      - '.github/workflows/military-hub-qa.yml'
  pull_request:
    paths:
      - 'military/**'
      - '.github/workflows/military-hub-qa.yml'
permissions:
  contents: read
jobs:
  locked-source:
    name: Private portal source and security assertions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node military/scripts/verify.mjs
  locked-browser:
    name: Locked-mode mobile and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/rw-military-http.log 2>&1 &
      - run: node military/scripts/smoke.mjs
      - run: node military/scripts/mobility-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehabwheel-military-locked-login-screenshots
          path: /tmp/rehabwheel-military-login-*.png
          if-no-files-found: ignore
          retention-days: 7
