name: Hockey lab source checks
on:
  push:
    paths:
      - 'hockey/**'
      - '.github/workflows/hockey-lab-qa.yml'
  pull_request:
    paths:
      - 'hockey/**'
      - '.github/workflows/hockey-lab-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate private lab static source
        run: node hockey/scripts/verify.mjs
